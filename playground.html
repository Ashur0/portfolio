<style>
  :root {
    color-scheme: dark;
    --bg: #06070c;
    --panel: rgba(13,15,25,0.72);
    --line: #1c2033;
    --ink: #eaf0ff;
    --muted: #8b93b0;
    --cyan: #35e6f2;
    --mag: #ff4fd8;
    --font: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: relative;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(8px);
  }
  .brand {
    font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
    margin-right: auto;
    background: linear-gradient(90deg, var(--cyan), var(--mag));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home {
    font-family: var(--font); font-size: 12px; letter-spacing: 0.06em; color: var(--muted);
    text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
  }
  .home:hover { color: var(--ink); border-color: #2c3350; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tab, .sound {
    font-family: var(--font); font-size: 12px; letter-spacing: 0.04em; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px;
    cursor: pointer; transition: color .15s, border-color .15s, background .15s;
  }
  .tab:hover, .sound:hover { color: var(--ink); border-color: #2c3350; }
  .tab[aria-selected="true"] {
    color: var(--bg); background: linear-gradient(90deg, var(--cyan), var(--mag)); border-color: transparent; font-weight: 600;
  }
  .sound[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); }
  .tab:focus-visible, .sound:focus-visible, .home:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hint {
    position: absolute; left: 16px; bottom: 14px; z-index: 4; font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    max-width: min(78vw, 380px); line-height: 1.5; pointer-events: none; backdrop-filter: blur(8px);
  }
  .hint b { color: var(--ink); font-weight: 600; }
  .credit { position: absolute; right: 16px; bottom: 14px; z-index: 4; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .credit a { color: var(--muted); text-decoration: none; border-bottom: 1px solid #2c3350; }
  .credit a:hover { color: var(--ink); }
  @media (max-width: 520px) { .credit { display: none; } }

  .intro {
    position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; text-align: center; padding: 24px;
    background: radial-gradient(120% 120% at 50% 40%, rgba(6,7,12,0.35), rgba(6,7,12,0.86) 70%);
    transition: opacity .7s ease;
  }
  .intro.gone { opacity: 0; pointer-events: none; }
  .intro h1 {
    margin: 0; font-size: clamp(30px, 8vw, 62px); letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 700; line-height: 1;
    background: linear-gradient(90deg, var(--cyan), #a78bff 45%, var(--mag));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(53,230,242,0.25));
  }
  .intro p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
  .enter {
    font-family: var(--font); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink); background: transparent; border: 1px solid var(--cyan); border-radius: 999px;
    padding: 13px 34px; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s;
  }
  .enter:hover { background: var(--cyan); color: var(--bg); box-shadow: 0 0 30px rgba(53,230,242,0.4); }
  .enter:focus-visible { outline: 2px solid var(--mag); outline-offset: 3px; }

<body>

<header>
  <div class="brand">Neon Playground</div>
  <div class="tabs" role="tablist" aria-label="Choose a scene">
    <button class="tab" role="tab" aria-selected="true"  data-mode="particles">Particle Field</button>
    <button class="tab" role="tab" aria-selected="false" data-mode="fluid">Ink Fluid</button>
    <button class="tab" role="tab" aria-selected="false" data-mode="terrain">Wireframe 3D</button>
    <button class="sound" id="sound" aria-pressed="false" title="Ambient sound + reactive visuals">&#9834; Sound</button>
  </div>
  <a class="home" href="index.html">&#8592; Home</a>
</header>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="hint" id="hint"></div>
  <div class="credit">built by <a href="https://github.com/ashur0">ashur0</a></div>
  <div class="intro" id="intro">
    <h1>Neon<br>Playground</h1>
    <p>three toys made of math &amp; light</p>
    <button class="enter" id="enter">Enter</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d", { alpha: false });
  var hintEl = document.getElementById("hint");
  var stage = canvas.parentElement;

  var W = 0, H = 0, DPR = 1;
  var mode = "particles";
  var audioLevel = 0;
  var ptr = { x: -9999, y: -9999, px: -9999, py: -9999, down: false };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (scenes[mode] && scenes[mode].resize) scenes[mode].resize();
  }
  function relPos(e) {
    var r = canvas.getBoundingClientRect(); var t = e.touches ? e.touches[0] : e;

  canvas.addEventListener("pointerdown", function (e) {
    var p = relPos(e); ptr.x = ptr.px = p.x; ptr.y = ptr.py = p.y; ptr.down = true;
    if (scenes[mode].down) scenes[mode].down();
  });
  window.addEventListener("pointermove", function (e) {
    var p = relPos(e); ptr.px = ptr.x; ptr.py = ptr.y; ptr.x = p.x; ptr.y = p.y;
    if (scenes[mode].move) scenes[mode].move();
  });
  window.addEventListener("pointerup", function () { ptr.down = false; if (scenes[mode].up) scenes[mode].up(); });
  canvas.addEventListener("pointerleave", function () { ptr.x = -9999; ptr.y = -9999; });
  canvas.addEventListener("wheel", function (e) { if (scenes[mode].wheel) { e.preventDefault(); scenes[mode].wheel(e.deltaY); } }, { passive: false });

  // audio
  var actx, analyser, freqData, master, audioReady = false, audioOn = false;
  function buildAudio() {
    if (audioReady) return;
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
    analyser = actx.createAnalyser(); analyser.fftSize = 256; freqData = new Uint8Array(analyser.frequencyBinCount);
    var filt = actx.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = 600; filt.Q.value = 7;
    filt.connect(master); filt.connect(analyser);
    [55, 82.41, 110, 164.81, 220, 329.63].forEach(function (n, i) {
      var o = actx.createOscillator(); o.type = (i % 2) ? "sawtooth" : "sine"; o.frequency.value = n;
      var g = actx.createGain(); g.gain.value = 0.06;
      var lfo = actx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.017;
      var lg = actx.createGain(); lg.gain.value = 0.045; lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(filt); o.start();
    });
    var flfo = actx.createOscillator(); flfo.frequency.value = 0.035;
    var flg = actx.createGain(); flg.gain.value = 380; flfo.connect(flg); flg.connect(filt.frequency); flfo.start();
    audioReady = true;
  }
  function ramp(v) { try { master.gain.linearRampToValueAtTime(v, actx.currentTime + 0.7); } catch (e) { master.gain.value = v; } }
  function setSound(on) {
    audioOn = on; document.getElementById("sound").setAttribute("aria-pressed", on ? "true" : "false");
    if (on) { buildAudio(); if (actx && actx.resume) actx.resume(); if (audioReady) ramp(0.55); }
    else if (audioReady) ramp(0);
  }
  document.getElementById("sound").addEventListener("click", function () { setSound(!audioOn); });
  function readAudio() {
    if (audioOn && analyser) {
      analyser.getByteFrequencyData(freqData);
      var s = 0, n = Math.min(48, freqData.length); for (var i = 0; i < n; i++) s += freqData[i];
      audioLevel += ((s / n) / 255 - audioLevel) * 0.2;
    } else { audioLevel += (0 - audioLevel) * 0.1; }
  }

  // scene 1 particles
  var Particles = (function () {
    var N, ps;
    function seed() {
      N = Math.round(Math.min(6500, Math.max(1400, (W * H) / 250))); ps = new Array(N);
      for (var i = 0; i < N; i++) ps[i] = { x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0 };
    }
    function field(x, y, t) { return (Math.sin(x * 0.0032 + t) + Math.cos(y * 0.0031 - t * 0.8) + Math.sin((x + y) * 0.0018 + t * 0.5)) * 1.4; }
    return {
      enter: function () { ctx.fillStyle = "#06070c"; ctx.fillRect(0, 0, W, H); seed(); },
      resize: function () { ctx.fillStyle = "#06070c"; ctx.fillRect(0, 0, W, H); seed(); },
      frame: function (t) {
        ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "rgba(6,7,12,0.11)"; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = "lighter";
        var time = t * 0.00016, push = 0.10 + audioLevel * 0.34;
        for (var i = 0; i < N; i++) {
          var p = ps[i], a = field(p.x, p.y, time);
          p.vx += Math.cos(a) * push; p.vy += Math.sin(a) * push;
          if (ptr.x > -9000) {
            var dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx * dx + dy * dy, R = ptr.down ? 210 : 135;
            if (d2 < R * R) { var d = Math.sqrt(d2) || 1, f = (R - d) / R * (ptr.down ? 2.6 : 1.4); p.vx += dx / d * f; p.vy += dy / d * f; }
          }
          p.vx *= 0.94; p.vy *= 0.94; p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x += W; else if (p.x >= W) p.x -= W;
          if (p.y < 0) p.y += H; else if (p.y >= H) p.y -= H;
          var sp = Math.min(1, (p.vx * p.vx + p.vy * p.vy) / 9), hue = 178 + sp * 132 + audioLevel * 20;
          ctx.fillStyle = "hsla(" + hue + ",100%," + (52 + sp * 26) + "%," + (0.28 + sp * 0.5) + ")";
          var s = 1 + sp * 1.8 + audioLevel * 1.2; ctx.fillRect(p.x, p.y, s, s);
        }
        ctx.globalCompositeOperation = "source-over";
      }
    };
  })();

  // scene 2 fluid
  var Fluid = (function () {
    var N = 96, size = (N + 2) * (N + 2);
    var u, v, u0, v0, rC, gC, bC, rC0, gC0, bC0, img, off, offctx, beat = 0;
    function IX(i, j) { return i + (N + 2) * j; }
    function f32() { return new Float32Array(size); }
    function alloc() {
      u = f32(); v = f32(); u0 = f32(); v0 = f32(); rC = f32(); gC = f32(); bC = f32(); rC0 = f32(); gC0 = f32(); bC0 = f32();
      off = document.createElement("canvas"); off.width = N; off.height = N; offctx = off.getContext("2d"); img = offctx.createImageData(N, N);
    }
    function addSource(x, s, dt) { for (var i = 0; i < size; i++) x[i] += dt * s[i]; }
    function setBnd(b, x) {
      for (var i = 1; i <= N; i++) {
        x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)]; x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
        x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)]; x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
      }
    }
    function lin(b, x, x0, a, c) {
      var inv = 1 / c;
      for (var k = 0; k < 6; k++) {
        for (var j = 1; j <= N; j++) for (var i = 1; i <= N; i++)
          x[IX(i, j)] = (x0[IX(i, j)] + a * (x[IX(i - 1, j)] + x[IX(i + 1, j)] + x[IX(i, j - 1)] + x[IX(i, j + 1)])) * inv;
        setBnd(b, x);
      }
    }
    function advect(b, dd, dd0, uu, vv, dt) {
      var dt0 = dt * N, i, j, x, y, i0, i1, j0, j1, s0, s1, t0, t1;
      for (j = 1; j <= N; j++) for (i = 1; i <= N; i++) {
        x = i - dt0 * uu[IX(i, j)]; y = j - dt0 * vv[IX(i, j)];
        if (x < 0.5) x = 0.5; if (x > N + 0.5) x = N + 0.5; i0 = x | 0; i1 = i0 + 1;
        if (y < 0.5) y = 0.5; if (y > N + 0.5) y = N + 0.5; j0 = y | 0; j1 = j0 + 1;
        s1 = x - i0; s0 = 1 - s1; t1 = y - j0; t0 = 1 - t1;
        dd[IX(i, j)] = s0 * (t0 * dd0[IX(i0, j0)] + t1 * dd0[IX(i0, j1)]) + s1 * (t0 * dd0[IX(i1, j0)] + t1 * dd0[IX(i1, j1)]);
      }
      setBnd(b, dd);
    }
    function project(uu, vv, p, div) {
      var h = 1 / N, i, j;
      for (j = 1; j <= N; j++) for (i = 1; i <= N; i++) { div[IX(i, j)] = -0.5 * h * (uu[IX(i + 1, j)] - uu[IX(i - 1, j)] + vv[IX(i, j + 1)] - vv[IX(i, j - 1)]); p[IX(i, j)] = 0; }
      setBnd(0, div); setBnd(0, p); lin(0, p, div, 1, 4);
      for (j = 1; j <= N; j++) for (i = 1; i <= N; i++) { uu[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) / h; vv[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) / h; }
      setBnd(1, uu); setBnd(2, vv);
    }
    function fade(arr, m) { for (var i = 0; i < size; i++) arr[i] *= m; }
    function step() {
      var dt = 0.13, t; addSource(u, u0, dt); addSource(v, v0, dt);
      t = u0; u0 = u; u = t; t = v0; v0 = v; v = t;
      advect(1, u, u0, u0, v0, dt); advect(2, v, v0, u0, v0, dt); project(u, v, u0, v0);
      var chans = [[rC, rC0], [gC, gC0], [bC, bC0]];
      for (var ci = 0; ci < 3; ci++) { var cur = chans[ci][0], prev = chans[ci][1]; addSource(cur, prev, dt); for (var z = 0; z < size; z++) prev[z] = cur[z]; advect(0, cur, prev, u, v, dt); fade(cur, 0.992); }
      for (var q = 0; q < size; q++) { u0[q] = 0; v0[q] = 0; rC0[q] = 0; gC0[q] = 0; bC0[q] = 0; }
    }
    function render() {
      var data = img.data, i, j, idx = 0;
      for (j = 1; j <= N; j++) for (i = 1; i <= N; i++) {
        var p = idx * 4; idx++; var r = rC[IX(i, j)], g = gC[IX(i, j)], b = bC[IX(i, j)];
        data[p] = r > 255 ? 255 : r; data[p + 1] = g > 255 ? 255 : g; data[p + 2] = b > 255 ? 255 : b; data[p + 3] = 255;
      }
      offctx.putImageData(img, 0, 0);
      ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#06070c"; ctx.fillRect(0, 0, W, H); ctx.imageSmoothingEnabled = true;
      if (typeof ctx.filter !== "undefined") {
        ctx.globalCompositeOperation = "lighter"; ctx.filter = "blur(" + (10 + audioLevel * 10) + "px)"; ctx.globalAlpha = 0.7;
        ctx.drawImage(off, 0, 0, W, H); ctx.filter = "none"; ctx.globalAlpha = 1;
      }

      var t = performance.now() * 0.0004, cr = 128 + 127 * Math.sin(t), cg = 128 + 127 * Math.sin(t + 2.1), cb = 128 + 127 * Math.sin(t + 4.2);
      for (var oy = -2; oy <= 2; oy++) for (var ox = -2; ox <= 2; ox++) {
        var xx = gx + ox, yy = gy + oy; if (xx < 1 || xx > N || yy < 1 || yy > N) continue;
        var w = Math.exp(-(ox * ox + oy * oy) / 4), id = IX(xx, yy);
        u0[id] += fx * w; v0[id] += fy * w; rC0[id] += cr * strength * w; gC0[id] += cg * strength * w; bC0[id] += cb * strength * w;
      }
    }
    function splat() { if (ptr.x < -9000) return; inject(Math.floor(ptr.x / W * N) + 1, Math.floor(ptr.y / H * N) + 1, (ptr.x - ptr.px) * 5, (ptr.y - ptr.py) * 5, 2.4); }
    return {
      enter: function () { if (!u) alloc(); ctx.fillStyle = "#06070c"; ctx.fillRect(0, 0, W, H); },
      resize: function () { ctx.fillStyle = "#06070c"; ctx.fillRect(0, 0, W, H); },
      down: splat, move: function () { if (ptr.down) splat(); },
      frame: function () {
        if (ptr.down) splat();
        if (audioLevel > 0.16) { beat += audioLevel; if (beat > 3) { beat = 0; var a = Math.random() * Math.PI * 2; inject(1 + ((Math.random() * N) | 0), 1 + ((Math.random() * N) | 0), Math.cos(a) * 40 * audioLevel, Math.sin(a) * 40 * audioLevel, 3.5 * audioLevel); } }
        step(); render();
      }
    };
  })();

  // scene 3 terrain
  var Terrain = (function () {
    var cols = 46, rows = 34, spacing = 26, yaw = 0, pitch = 0.62, amp = 62, targetAmp = 62, autoYaw = true;
    function hf(x, z, t) { return Math.sin(x * 0.35 + t) * 0.5 + Math.cos(z * 0.42 - t * 0.9) * 0.5 + Math.sin((x + z) * 0.2 + t * 0.6) * 0.4; }
    return {
      enter: function () {}, resize: function () {},
      down: function () { autoYaw = false; },
      move: function () { if (ptr.down) { yaw += (ptr.x - ptr.px) * 0.006; pitch += (ptr.y - ptr.py) * 0.004; if (pitch < 0.15) pitch = 0.15; if (pitch > 1.25) pitch = 1.25; } },
      wheel: function (dy) { targetAmp += (dy > 0 ? -8 : 8); if (targetAmp < 4) targetAmp = 4; if (targetAmp > 140) targetAmp = 140; },
      frame: function (tt) {
        var t = tt * 0.0009; if (autoYaw) yaw += 0.0016;
        var effAmp = amp * (1 + audioLevel * 0.6); amp += (targetAmp - amp) * 0.08;
        ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#06070c"; ctx.fillRect(0, 0, W, H);
        var grd = ctx.createLinearGradient(0, H * 0.30, 0, H * 0.62);
        grd.addColorStop(0, "rgba(255,79,216," + (0.05 + audioLevel * 0.12) + ")"); grd.addColorStop(1, "rgba(53,230,242,0)");
        ctx.fillStyle = grd; ctx.fillRect(0, H * 0.30, W, H * 0.32);
        var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
        var focal = Math.min(W, H) * 1.05, cx = W / 2, cyy = H * 0.52, pts = [];
        for (var j = 0; j < rows; j++) { pts[j] = []; for (var i = 0; i < cols; i++) {
          var wx = (i - (cols - 1) / 2) * spacing, wz = (j - (rows - 1) / 2) * spacing, wy = hf(i, j, t) * effAmp;
          var rx = wx * cy - wz * sy, rz = wx * sy + wz * cy, ry = wy * cp - rz * sp, rz2 = wy * sp + rz * cp, zc = rz2 + 640; if (zc < 40) zc = 40;
          var s = focal / zc; pts[j][i] = { x: cx + rx * s, y: cyy + ry * s, d: zc };
        } }
        ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 1;
        for (var jj = 0; jj < rows; jj++) for (var ii = 0; ii < cols; ii++) {
          var a = pts[jj][ii], depth = 1 - Math.min(1, (a.d - 400) / 900), hue = 178 + (1 - depth) * 132;
          ctx.strokeStyle = "hsla(" + hue + ",100%,62%," + (0.10 + depth * 0.55) + ")";
          if (ii < cols - 1) { var b = pts[jj][ii + 1]; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
          if (jj < rows - 1) { var c = pts[jj + 1][ii]; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.stroke(); }
        }
        ctx.globalCompositeOperation = "source-over";
      }
    };
  })();

  var scenes = { particles: Particles, fluid: Fluid, terrain: Terrain };
  var hints = {
    particles: "<b>Move your cursor</b> to part the flow. <b>Click &amp; hold</b> to push. Try <b>&#9834; Sound</b>.",
    fluid: "<b>Drag anywhere</b> to inject ink — real fluid math. Turn on <b>&#9834; Sound</b> and it pulses.",
    terrain: "<b>Drag</b> to orbit. <b>Scroll</b> to warp the waves. <b>&#9834; Sound</b> drives the height."
  };
  function setMode(m) {
    mode = m;
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", t.dataset.mode === m ? "true" : "false"); });
    hintEl.innerHTML = hints[m]; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (scenes[m].enter) scenes[m].enter();
  }
  document.querySelectorAll(".tab").forEach(function (t) { t.addEventListener("click", function () { setMode(t.dataset.mode); }); });

  var intro = document.getElementById("intro");
  function enter() { intro.classList.add("gone"); setTimeout(function () { intro.hidden = true; }, 750); }
  document.getElementById("enter").addEventListener("click", enter);

  function loop(t) { readAudio(); scenes[mode].frame(t); requestAnimationFrame(loop); }
  window.addEventListener("resize", resize);
  resize(); setMode("particles"); requestAnimationFrame(loop);
})();
</script>
</body>
