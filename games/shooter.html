<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twin Neon — ashur0</title>
<meta name="description" content="A twin-stick neon shooter. Move and aim independently, blast the waves, grab power-ups.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d13'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23a78bff'/%3E%3C/svg%3E">
<style>
  html,body{height:100%;margin:0;background:#05060b;color:#eaf0ff;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}
  .hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;z-index:3;font-size:13px;letter-spacing:.04em;}
  .hud .box{background:rgba(10,13,22,.6);border:1px solid #1c2033;border-radius:8px;padding:6px 11px;backdrop-filter:blur(6px);}
  .lv{color:#a78bff;}
  .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none;}
  .panel{pointer-events:auto;background:rgba(9,11,20,.92);border:1px solid #232a3d;border-radius:16px;padding:28px 26px;max-width:min(92vw,480px);text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.6);}
  .panel h1{margin:0 0 6px;font-size:30px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,#a78bff,#35e6f2);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .panel p{margin:6px 0;color:#9aa3ba;font-size:13px;line-height:1.6;}
  .panel .big{font-size:15px;color:#eaf0ff;}
  .btn{pointer-events:auto;font-family:inherit;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#05060b;background:linear-gradient(90deg,#a78bff,#35e6f2);border:none;border-radius:999px;padding:13px 30px;cursor:pointer;margin-top:18px;}
  .btn:hover{box-shadow:0 0 26px rgba(167,139,255,.4);}
  .wave{position:absolute;top:52px;left:0;right:0;text-align:center;z-index:3;font-size:22px;font-weight:700;color:#a78bff;text-shadow:0 0 16px rgba(167,139,255,.6);pointer-events:none;opacity:0;transition:opacity .2s;}
  a.home{position:absolute;bottom:12px;right:12px;z-index:4;color:#5b6479;font-size:11.5px;text-decoration:none;border-bottom:1px solid #232a3d;}
  a.home:hover{color:#eaf0ff;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="box">WAVE <b class="lv" id="wave">1</b> &nbsp; SCORE <b id="score">0</b></div>
    <div class="box">HP <b id="hp">100</b> &nbsp; BEST <b class="lv" id="best">0</b></div>
  </div>
  <div class="wave" id="wavemsg"></div>
  <div class="center" id="overlay"><div class="panel" id="panel"></div></div>
  <a class="home" href="index.html">&larr; arcade</a>
</div>
<script>
(function(){
"use strict";
var c=document.getElementById("c"),ctx=c.getContext("2d");
var W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR|0;c.height=H*DPR|0;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();

var keys={};
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(e.key.toLowerCase())>=0)e.preventDefault();});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
var mouse={x:W/2,y:0,down:false};
c.addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
c.addEventListener("mousedown",function(e){mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener("mouseup",function(){mouse.down=false;});
// touch: left half = move joystick, right half = aim+fire joystick
var moveT={id:null,cx:0,cy:0,dx:0,dy:0},aimT={id:null,cx:0,cy:0,dx:0,dy:0};
c.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse")return;if(e.clientX<W/2&&moveT.id===null){moveT.id=e.pointerId;moveT.cx=e.clientX;moveT.cy=e.clientY;}else if(aimT.id===null){aimT.id=e.pointerId;aimT.cx=e.clientX;aimT.cy=e.clientY;}});
c.addEventListener("pointermove",function(e){if(e.pointerType==="mouse")return;if(e.pointerId===moveT.id){var dx=e.clientX-moveT.cx,dy=e.clientY-moveT.cy,d=Math.hypot(dx,dy)||1,m=Math.min(d,50)/50;moveT.dx=dx/d*m;moveT.dy=dy/d*m;}else if(e.pointerId===aimT.id){var ax=e.clientX-aimT.cx,ay=e.clientY-aimT.cy,ad=Math.hypot(ax,ay)||1;aimT.dx=ax/ad;aimT.dy=ay/ad;}});
addEventListener("pointerup",function(e){if(e.pointerId===moveT.id){moveT.id=null;moveT.dx=0;moveT.dy=0;}if(e.pointerId===aimT.id){aimT.id=null;aimT.dx=0;aimT.dy=0;}});
function pad(){var gp=navigator.getGamepads&&navigator.getGamepads()[0];return gp||null;}

var rand=function(a,b){return a+Math.random()*(b-a);},TAU=Math.PI*2;
var state,player,enemies,pb,eb,parts,pups,score,wave,waveT,shake,spawnLeft;
var best=0;try{best=+localStorage.getItem("shooter_best")||0;}catch(e){}
document.getElementById("best").textContent=best;

function reset(){player={x:W/2,y:H/2,r:12,hp:100,speed:3.4,fireT:0,fireRate:0.14,spread:0,dmg:12,aimA:0};
  enemies=[];pb=[];eb=[];parts=[];pups=[];score=0;wave=0;waveT=0;shake=0;spawnLeft=0;nextWave();}

var overlay=document.getElementById("overlay"),panel=document.getElementById("panel"),waveEl=document.getElementById("wavemsg");
function showStart(){state="start";overlay.hidden=false;
  panel.innerHTML='<h1>Twin Neon</h1><p class="big">Move one way, shoot another.</p>'+
  '<p>Clear waves of neon enemies. <b>Move</b> with WASD / left stick; <b>aim &amp; fire</b> with the mouse (hold), the right stick, or the right side of the screen on touch. Grab power-ups the wrecks drop.</p>'+
  (best>0?'<p>Best score: <b class="lv">'+best+'</b></p>':'')+
  '<button class="btn" id="go">Fight</button>';
  document.getElementById("go").onclick=start;
}
function showDead(){state="dead";overlay.hidden=false;var win=score>best;if(win){best=score;try{localStorage.setItem("shooter_best",best);}catch(e){}document.getElementById("best").textContent=best;}
  panel.innerHTML='<h1>Destroyed</h1><p class="big">Wave '+wave+' &middot; <b class="lv">'+score+'</b> pts</p>'+
  (win?'<p class="lv">★ New best!</p>':'<p>Best: '+best+'</p>')+
  '<button class="btn" id="go">Retry</button>';
  document.getElementById("go").onclick=start;
}
function start(){reset();overlay.hidden=true;state="play";}
function nextWave(){wave++;spawnLeft=4+wave*2;waveEl.textContent="WAVE "+wave;waveEl.style.opacity="1";setTimeout(function(){waveEl.style.opacity="0";},900);}

function spawnEnemy(){
  var edge=(Math.random()*4)|0,x,y;
  if(edge===0){x=rand(0,W);y=-20;}else if(edge===1){x=W+20;y=rand(0,H);}else if(edge===2){x=rand(0,W);y=H+20;}else{x=-20;y=rand(0,H);}
  var diff=1+wave*0.12;
  var t=Math.random();
  if(t<.6)enemies.push({x:x,y:y,r:11,hp:18*diff,speed:rand(1.3,1.7),dmg:12,col:"#7bd8ff",pts:10,type:"chase",hitT:0});
  else if(t<.85)enemies.push({x:x,y:y,r:16,hp:46*diff,speed:1.0,dmg:20,col:"#a78bff",pts:25,type:"chase",hitT:0});
  else enemies.push({x:x,y:y,r:13,hp:28*diff,speed:0.7,dmg:12,col:"#ff8bd0",pts:30,type:"turret",fire:rand(1,2),hitT:0});
}
function addPart(x,y,col,n,sp){for(var i=0;i<n;i++){var a=rand(0,TAU),s=rand(.4,1)*sp;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col,r:rand(1,3)});}}

var last=performance.now();
function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;if(state==="play")update(dt);render();requestAnimationFrame(loop);}

function update(dt){
  // move
  var mx=0,my=0;
  if(keys["a"]||keys["arrowleft"])mx-=1;if(keys["d"]||keys["arrowright"])mx+=1;
  if(keys["w"])my-=1;if(keys["s"])my+=1;
  if(keys["arrowup"])my-=1;if(keys["arrowdown"])my+=1;
  var gp=pad();if(gp){if(Math.abs(gp.axes[0])>0.2)mx+=gp.axes[0];if(Math.abs(gp.axes[1])>0.2)my+=gp.axes[1];}
  mx+=moveT.dx;my+=moveT.dy;
  var ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  player.x=Math.max(player.r,Math.min(W-player.r,player.x+mx*player.speed));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y+my*player.speed));

  // aim + fire
  var ax=0,ay=0,firing=false;
  if(gp&&(Math.abs(gp.axes[2])>0.25||Math.abs(gp.axes[3])>0.25)){ax=gp.axes[2];ay=gp.axes[3];firing=true;}
  if(aimT.id!==null){ax=aimT.dx;ay=aimT.dy;firing=true;}
  if(!firing&&mouse.down){ax=mouse.x-player.x;ay=mouse.y-player.y;firing=true;}
  if(!firing){ // idle aim toward mouse (desktop) for visual
    ax=mouse.x-player.x;ay=mouse.y-player.y;
  }
  if(ax||ay)player.aimA=Math.atan2(ay,ax);
  player.fireT-=dt;
  if(firing&&player.fireT<=0){player.fireT=player.fireRate;
    var n=1+player.spread,base=player.aimA;
    for(var s=0;s<n;s++){var a=base+(s-(n-1)/2)*0.14;pb.push({x:player.x+Math.cos(base)*14,y:player.y+Math.sin(base)*14,vx:Math.cos(a)*9,vy:Math.sin(a)*9,r:4,dmg:player.dmg,life:1.2});}
    shake=Math.max(shake,1.2);
  }

  // spawn
  if(spawnLeft>0){spawnT=(spawnT||0)-dt;if(spawnT<=0){spawnT=Math.max(0.3,0.9-wave*0.03);spawnEnemy();spawnLeft--;}}
  else if(enemies.length===0){nextWave();}

  // player bullets
  for(var i=pb.length-1;i>=0;i--){var b=pb[i];b.x+=b.vx;b.y+=b.vy;b.life-=dt;
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){pb.splice(i,1);continue;}
    for(var j=0;j<enemies.length;j++){var e=enemies[j],dx=e.x-b.x,dy=e.y-b.y,rr=e.r+b.r;
      if(dx*dx+dy*dy<rr*rr){e.hp-=b.dmg;e.hitT=0.08;addPart(b.x,b.y,e.col,4,3);pb.splice(i,1);break;}}
  }
  // enemies
  for(var k=enemies.length-1;k>=0;k--){var e=enemies[k];var dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.hitT=Math.max(0,e.hitT-dt);
    if(e.type==="turret"){if(d>240){e.x+=dx/d*e.speed;e.y+=dy/d*e.speed;}e.fire-=dt;if(e.fire<=0){e.fire=Math.max(0.7,1.8-wave*0.05);eb.push({x:e.x,y:e.y,vx:dx/d*4.2,vy:dy/d*4.2,r:5,dmg:e.dmg,life:3});}}
    else{e.x+=dx/d*e.speed;e.y+=dy/d*e.speed;}
    if(d<player.r+e.r){player.hp-=e.dmg*dt*2.4;shake=Math.max(shake,3);}
    if(e.hp<=0){enemies.splice(k,1);score+=e.pts;addPart(e.x,e.y,e.col,12,4.5);shake=Math.max(shake,2.5);
      if(Math.random()<0.14){var kind=["spread","rapid","heal"][(Math.random()*3)|0];pups.push({x:e.x,y:e.y,r:9,kind:kind,life:9});}
    }
  }
  // enemy bullets
  for(var m=eb.length-1;m>=0;m--){var eb2=eb[m];eb2.x+=eb2.vx;eb2.y+=eb2.vy;eb2.life-=dt;
    if(eb2.life<=0){eb.splice(m,1);continue;}
    var dxx=player.x-eb2.x,dyy=player.y-eb2.y,rr=player.r+eb2.r;
    if(dxx*dxx+dyy*dyy<rr*rr){player.hp-=eb2.dmg;eb.splice(m,1);shake=Math.max(shake,4);}
  }
  // pickups
  for(var p=pups.length-1;p>=0;p--){var pu=pups[p];pu.life-=dt;var dx3=player.x-pu.x,dy3=player.y-pu.y;
    if(pu.life<=0){pups.splice(p,1);continue;}
    if(dx3*dx3+dy3*dy3<(player.r+pu.r)*(player.r+pu.r)){
      if(pu.kind==="heal")player.hp=Math.min(100,player.hp+30);
      else if(pu.kind==="spread")player.spread=Math.min(6,player.spread+1);
      else if(pu.kind==="rapid")player.fireRate=Math.max(0.05,player.fireRate*0.82);
      addPart(pu.x,pu.y,"#6effc0",14,4);pups.splice(p,1);
    }
  }
  for(var q=parts.length-1;q>=0;q--){var pt=parts[q];pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.92;pt.vy*=0.92;pt.life-=dt*2.2;if(pt.life<=0)parts.splice(q,1);}
  shake*=0.86;
  if(player.hp<=0){player.hp=0;showDead();}
  document.getElementById("wave").textContent=wave;
  document.getElementById("score").textContent=score;
  document.getElementById("hp").textContent=Math.ceil(player.hp);
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle="#05060b";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(40,52,84,.3)";ctx.lineWidth=1;var gs=48;
  ctx.beginPath();for(var x=0;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}for(var y=0;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
  if(shake>0.3)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<parts.length;i++){var pt=parts[i];ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.col;ctx.fillRect(pt.x-pt.r/2,pt.y-pt.r/2,pt.r,pt.r);}
  ctx.globalAlpha=1;
  // pickups
  for(var p=0;p<pups.length;p++){var pu=pups[p];var col=pu.kind==="heal"?"#6effc0":pu.kind==="rapid"?"#ffd84f":"#35e6f2";ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(pu.x,pu.y,pu.r,0,TAU);ctx.stroke();ctx.fillStyle=col;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(pu.x,pu.y,pu.r*0.5,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  // bullets
  ctx.fillStyle="#eafcff";for(var b=0;b<pb.length;b++){ctx.beginPath();ctx.arc(pb[b].x,pb[b].y,pb[b].r,0,TAU);ctx.fill();}
  ctx.fillStyle="#ff6a8a";for(var eb3=0;eb3<eb.length;eb3++){ctx.beginPath();ctx.arc(eb[eb3].x,eb[eb3].y,eb[eb3].r,0,TAU);ctx.fill();}
  // enemies
  for(var e=0;e<enemies.length;e++){var en=enemies[e];ctx.fillStyle=en.hitT>0?"#fff":en.col;
    if(en.type==="turret"){ctx.save();ctx.translate(en.x,en.y);ctx.rotate(performance.now()*0.002);ctx.fillRect(-en.r,-en.r,en.r*2,en.r*2);ctx.restore();}
    else{ctx.beginPath();ctx.arc(en.x,en.y,en.r,0,TAU);ctx.fill();}
  }
  // player
  ctx.globalCompositeOperation="source-over";
  if(state!=="start"){
    ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.aimA);
    ctx.shadowColor="#a78bff";ctx.shadowBlur=16;ctx.fillStyle="#a78bff";
    ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-9,-9);ctx.lineTo(-5,0);ctx.lineTo(-9,9);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
var spawnT=0;
showStart();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
