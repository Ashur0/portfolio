<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Arena — ashur0</title>
<meta name="description" content="A neon arena survivor game. Move, auto-fire, level up, survive the swarm.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d13'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2335e6f2'/%3E%3C/svg%3E">
<style>
  html,body{height:100%;margin:0;background:#05060b;color:#eaf0ff;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;background:#05060b;}
  .hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;z-index:3;font-size:13px;letter-spacing:.04em;}
  .hud .box{background:rgba(10,13,22,.6);border:1px solid #1c2033;border-radius:8px;padding:6px 11px;backdrop-filter:blur(6px);}
  .hud .lv{color:#35e6f2;}
  .xpbar{position:absolute;top:0;left:0;right:0;height:4px;background:#12162a;z-index:3;}
  .xpbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35e6f2,#ff4fd8);transition:width .12s;}
  .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none;}
  .panel{pointer-events:auto;background:rgba(9,11,20,.92);border:1px solid #232a3d;border-radius:16px;padding:28px 26px;max-width:min(92vw,520px);text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.6);}
  .panel h1{margin:0 0 6px;font-size:30px;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#35e6f2,#a78bff,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .panel p{margin:6px 0;color:#9aa3ba;font-size:13px;line-height:1.6;}
  .panel .big{font-size:15px;color:#eaf0ff;}
  .upgrades{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .up{pointer-events:auto;display:flex;gap:12px;align-items:center;text-align:left;background:#0e1120;border:1px solid #232a3d;border-radius:12px;padding:13px 15px;cursor:pointer;color:#eaf0ff;font-family:inherit;transition:border-color .12s,background .12s,transform .06s;}
  .up:hover,.up.sel{border-color:#35e6f2;background:#101a25;}
  .up:active{transform:scale(.99);}
  .up .ic{font-size:22px;width:30px;text-align:center;}
  .up .tt{font-size:14px;font-weight:600;}
  .up .ds{font-size:12px;color:#9aa3ba;margin-top:2px;}
  .btn{pointer-events:auto;font-family:inherit;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#05060b;background:linear-gradient(90deg,#35e6f2,#ff4fd8);border:none;border-radius:999px;padding:13px 30px;cursor:pointer;margin-top:18px;}
  .btn:hover{box-shadow:0 0 26px rgba(53,230,242,.4);}
  .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#5b6479;font-size:11.5px;z-index:3;letter-spacing:.05em;}
  a.home{position:absolute;bottom:12px;right:12px;z-index:4;color:#5b6479;font-size:11.5px;text-decoration:none;border-bottom:1px solid #232a3d;}
  a.home:hover{color:#eaf0ff;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="xpbar"><i id="xpfill"></i></div>
  <div class="hud">
    <div class="box">TIME <b id="time">0:00</b> &nbsp; LV <b class="lv" id="lv">1</b></div>
    <div class="box">HP <b id="hp">100</b> &nbsp; KILLS <b id="kills">0</b></div>
  </div>
  <div class="center" id="overlay">
    <div class="panel" id="panel"></div>
  </div>
  <div class="hint" id="hint">WASD / Arrows / left stick to move &middot; fire is automatic</div>
  <a class="home" href="index.html">&larr; arcade</a>
</div>
<script>
(function(){
"use strict";
var c=document.getElementById("c"),ctx=c.getContext("2d");
var W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR|0;c.height=H*DPR|0;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();

var keys={};
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(e.key.toLowerCase())>=0)e.preventDefault();});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
// touch joystick
var touch={active:false,cx:0,cy:0,dx:0,dy:0};
c.addEventListener("pointerdown",function(e){if(state!=="play")return;touch.active=true;touch.cx=e.clientX;touch.cy=e.clientY;touch.dx=0;touch.dy=0;});
c.addEventListener("pointermove",function(e){if(!touch.active)return;var dx=e.clientX-touch.cx,dy=e.clientY-touch.cy,d=Math.hypot(dx,dy)||1,m=Math.min(d,55)/55;touch.dx=dx/d*m;touch.dy=dy/d*m;});
addEventListener("pointerup",function(){touch.active=false;touch.dx=0;touch.dy=0;});

function pad(){var gp=navigator.getGamepads&&navigator.getGamepads()[0];if(!gp)return null;return gp;}

var rand=function(a,b){return a+Math.random()*(b-a);};
var TAU=Math.PI*2;

// entities
var player,enemies,bullets,gems,parts,state,tPlay,kills,shake,spawnT,bossT,waveN,pauseChoices;
var best=0;try{best=+localStorage.getItem("arena_best")||0;}catch(e){}

function reset(){
  player={x:W/2,y:H/2,r:11,hp:100,maxhp:100,speed:3.1,
    fireRate:0.42,fireT:0,dmg:14,bulletSpeed:7.2,range:520,pierce:0,shots:1,spread:0.16,pickup:60,regen:0};
  enemies=[];bullets=[];gems=[];parts=[];
  tPlay=0;kills=0;shake=0;spawnT=0;bossT=18;waveN=0;
  player.level=1;player.xp=0;player.xpNext=5;
}

function addPart(x,y,col,n,sp){for(var i=0;i<n;i++){var a=rand(0,TAU),s=rand(.5,1)*sp;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col,r:rand(1,3)});}}

function spawnEnemy(boss){
  var edge=(Math.random()*4)|0,x,y;
  if(edge===0){x=rand(0,W);y=-20;}else if(edge===1){x=W+20;y=rand(0,H);}else if(edge===2){x=rand(0,W);y=H+20;}else{x=-20;y=rand(0,H);}
  var diff=1+tPlay/45;
  if(boss){enemies.push({x:x,y:y,r:34,hp:220*diff,maxhp:220*diff,speed:1.05,dmg:34,boss:true,col:"#ff4fd8",xp:40,hitT:0});}
  else{
    var t=Math.random();
    if(t<.68)enemies.push({x:x,y:y,r:10,hp:16*diff,maxhp:16*diff,speed:rand(1.5,1.9),dmg:9,col:"#7bd8ff",xp:1,hitT:0});
    else if(t<.9)enemies.push({x:x,y:y,r:15,hp:42*diff,maxhp:42*diff,speed:1.15,dmg:16,col:"#a78bff",xp:3,hitT:0});
    else enemies.push({x:x,y:y,r:7,hp:8*diff,maxhp:8*diff,speed:2.9,dmg:7,col:"#ff8bd0",xp:2,hitT:0});
  }
}

// upgrades pool
var UPG=[
 {ic:"⚡",tt:"Rapid Fire",ds:"+22% fire rate",fn:function(p){p.fireRate*=0.8;}},
 {ic:"🔥",tt:"High Caliber",ds:"+30% damage",fn:function(p){p.dmg*=1.3;}},
 {ic:"👟",tt:"Swift",ds:"+14% move speed",fn:function(p){p.speed*=1.14;}},
 {ic:"✚",tt:"Vitality",ds:"+30 max HP, heal 30",fn:function(p){p.maxhp+=30;p.hp=Math.min(p.maxhp,p.hp+30);}},
 {ic:"🌀",tt:"Multi-shot",ds:"+1 projectile",fn:function(p){p.shots+=1;}},
 {ic:"➤",tt:"Piercing",ds:"bullets pierce +1",fn:function(p){p.pierce+=1;}},
 {ic:"🧲",tt:"Magnet",ds:"+50% pickup range",fn:function(p){p.pickup*=1.5;}},
 {ic:"♥",tt:"Regen",ds:"+0.6 HP/sec",fn:function(p){p.regen+=0.6;}},
 {ic:"💨",tt:"Velocity",ds:"+25% bullet speed",fn:function(p){p.bulletSpeed*=1.25;}}
];
function pick3(){var a=UPG.slice(),r=[];for(var i=0;i<3&&a.length;i++){var k=(Math.random()*a.length)|0;r.push(a.splice(k,1)[0]);}return r;}

// overlays
var overlay=document.getElementById("overlay"),panel=document.getElementById("panel"),hint=document.getElementById("hint");
function showStart(){
  state="start";overlay.hidden=false;hint.hidden=true;
  panel.innerHTML='<h1>Neon Arena</h1>'+
    '<p class="big">Survive the swarm.</p>'+
    '<p>Move to dodge — your gun fires on its own at the nearest enemy. Kill enemies, grab XP gems, level up, and stack upgrades. A boss arrives every 18 seconds.</p>'+
    '<p>Move: <b>WASD / Arrows</b>, left stick, or drag on touch.</p>'+
    (best>0?'<p>Best time: <b class="lv">'+fmt(best)+'</b></p>':'')+
    '<button class="btn" id="go">Start</button>';
  document.getElementById("go").onclick=start;
}
function showDead(){
  state="dead";overlay.hidden=false;
  var win=tPlay>best;if(win){best=tPlay;try{localStorage.setItem("arena_best",best);}catch(e){}}
  panel.innerHTML='<h1>Down</h1>'+
    '<p class="big">You lasted <b class="lv">'+fmt(tPlay)+'</b></p>'+
    '<p>Level '+player.level+' &middot; '+kills+' kills</p>'+
    (win?'<p class="lv">★ New best time!</p>':'<p>Best: '+fmt(best)+'</p>')+
    '<button class="btn" id="go">Run again</button>';
  document.getElementById("go").onclick=start;
}
var selIdx=0;
function showLevel(){
  state="level";overlay.hidden=false;selIdx=0;
  pauseChoices=pick3();
  var html='<h1>Level '+player.level+'</h1><p>Choose an upgrade</p><div class="upgrades">';
  pauseChoices.forEach(function(u,i){html+='<button class="up'+(i===0?' sel':'')+'" data-i="'+i+'"><span class="ic">'+u.ic+'</span><span><span class="tt">'+u.tt+'</span><span class="ds">'+u.ds+'</span></span></button>';});
  html+='</div><p style="margin-top:12px;font-size:11px;">↑↓ or stick to highlight &middot; Enter / A to pick</p>';
  panel.innerHTML=html;
  Array.prototype.forEach.call(panel.querySelectorAll(".up"),function(b){b.onclick=function(){choose(+b.dataset.i);};});
}
function highlight(){Array.prototype.forEach.call(panel.querySelectorAll(".up"),function(b,i){b.classList.toggle("sel",i===selIdx);});}
function choose(i){pauseChoices[i].fn(player);overlay.hidden=true;state="play";}

function start(){reset();overlay.hidden=true;hint.hidden=false;state="play";}
function fmt(s){var m=(s/60)|0,ss=(s%60)|0;return m+":"+(ss<10?"0":"")+ss;}

// level nav via keyboard/pad in overlay
var navLock=0;
function overlayNav(dt){
  if(state!=="level")return;
  var gp=pad();
  var up=keys["arrowup"]||keys["w"]||(gp&&(gp.axes[1]<-0.5||(gp.buttons[12]&&gp.buttons[12].pressed)));
  var dn=keys["arrowdown"]||keys["s"]||(gp&&(gp.axes[1]>0.5||(gp.buttons[13]&&gp.buttons[13].pressed)));
  var ok=keys["enter"]||keys[" "]||(gp&&gp.buttons[0]&&gp.buttons[0].pressed);
  navLock-=dt;
  if(navLock<=0){
    if(up){selIdx=(selIdx+2)%3;highlight();navLock=0.16;}
    else if(dn){selIdx=(selIdx+1)%3;highlight();navLock=0.16;}
  }
  if(ok){choose(selIdx);}
}

// main loop
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==="play")update(dt);
  else overlayNav(dt);
  render();
  requestAnimationFrame(loop);
}

function nearestEnemy(){var best=null,bd=player.range*player.range;for(var i=0;i<enemies.length;i++){var e=enemies[i],dx=e.x-player.x,dy=e.y-player.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e;}}return best;}

function update(dt){
  tPlay+=dt;
  // input
  var mx=0,my=0;
  if(keys["a"]||keys["arrowleft"])mx-=1;if(keys["d"]||keys["arrowright"])mx+=1;
  if(keys["w"]||keys["arrowup"])my-=1;if(keys["s"]||keys["arrowdown"])my+=1;
  var gp=pad();if(gp){if(Math.abs(gp.axes[0])>0.18)mx+=gp.axes[0];if(Math.abs(gp.axes[1])>0.18)my+=gp.axes[1];}
  if(touch.active){mx+=touch.dx;my+=touch.dy;}
  var ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  player.x+=mx*player.speed;player.y+=my*player.speed;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
  if(player.regen)player.hp=Math.min(player.maxhp,player.hp+player.regen*dt);

  // firing
  player.fireT-=dt;
  if(player.fireT<=0){
    var tgt=nearestEnemy();
    if(tgt){
      player.fireT=player.fireRate;
      var base=Math.atan2(tgt.y-player.y,tgt.x-player.x);
      var n=player.shots,off=(n-1)*player.spread/2;
      for(var s=0;s<n;s++){var a=base-off+s*player.spread;
        bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*player.bulletSpeed,vy:Math.sin(a)*player.bulletSpeed,r:4,dmg:player.dmg,pierce:player.pierce,life:1.4});}
    }
  }
  // spawn
  spawnT-=dt;
  var rate=Math.max(0.18,0.95-tPlay/60);
  if(spawnT<=0){spawnT=rate;spawnEnemy(false);if(tPlay>25&&Math.random()<0.4)spawnEnemy(false);}
  bossT-=dt;if(bossT<=0){bossT=18;spawnEnemy(true);shake=8;}

  // bullets
  for(var i=bullets.length-1;i>=0;i--){var b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life-=dt;
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue;}
    for(var j=0;j<enemies.length;j++){var e=enemies[j],dx=e.x-b.x,dy=e.y-b.y,rr=(e.r+b.r);
      if(dx*dx+dy*dy<rr*rr){e.hp-=b.dmg;e.hitT=0.08;addPart(b.x,b.y,e.col,4,3);
        if(b.pierce>0){b.pierce--;}else{bullets.splice(i,1);}
        break;}}
  }
  // enemies
  for(var k=enemies.length-1;k>=0;k--){var e=enemies[k];var dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*e.speed;e.y+=dy/d*e.speed;e.hitT=Math.max(0,e.hitT-dt);
    // separation
    var rr=player.r+e.r;
    if(d<rr){player.hp-=e.dmg*dt*2.2;shake=Math.max(shake,3);}
    if(e.hp<=0){enemies.splice(k,1);kills++;addPart(e.x,e.y,e.col,e.boss?26:10,e.boss?6:4);shake=Math.max(shake,e.boss?9:2);
      for(var g=0;g<(e.boss?8:1);g++)gems.push({x:e.x+rand(-10,10),y:e.y+rand(-10,10),r:4,xp:Math.max(1,(e.xp/(e.boss?8:1))|0)||1,vx:rand(-1,1),vy:rand(-1,1)});
    }
  }
  // gems
  for(var m=gems.length-1;m>=0;m--){var gm=gems[m];var dx2=player.x-gm.x,dy2=player.y-gm.y,d2=Math.hypot(dx2,dy2)||1;
    if(d2<player.pickup){gm.x+=dx2/d2*6;gm.y+=dy2/d2*6;}else{gm.x+=gm.vx;gm.y+=gm.vy;gm.vx*=0.9;gm.vy*=0.9;}
    if(d2<player.r+6){player.xp+=gm.xp;gems.splice(m,1);
      if(player.xp>=player.xpNext){player.xp-=player.xpNext;player.level++;player.xpNext=Math.round(player.xpNext*1.35+2);showLevel();}
    }
  }
  // particles
  for(var p=parts.length-1;p>=0;p--){var pt=parts[p];pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.92;pt.vy*=0.92;pt.life-=dt*2.2;if(pt.life<=0)parts.splice(p,1);}
  shake*=0.86;
  if(player.hp<=0){player.hp=0;showDead();}
  // hud
  document.getElementById("time").textContent=fmt(tPlay);
  document.getElementById("lv").textContent=player.level;
  document.getElementById("hp").textContent=Math.ceil(player.hp);
  document.getElementById("kills").textContent=kills;
  document.getElementById("xpfill").style.width=(player.xp/player.xpNext*100)+"%";
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle="#05060b";ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle="rgba(40,52,84,.35)";ctx.lineWidth=1;var gs=48;
  ctx.beginPath();for(var x=0;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}for(var y=0;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
  if(shake>0.2){ctx.translate(rand(-shake,shake),rand(-shake,shake));}
  ctx.globalCompositeOperation="lighter";
  // gems
  for(var i=0;i<gems.length;i++){var g=gems[i];ctx.fillStyle="#6effc0";ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.fill();}
  // particles
  for(var p=0;p<parts.length;p++){var pt=parts[p];ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.col;ctx.fillRect(pt.x-pt.r/2,pt.y-pt.r/2,pt.r,pt.r);}
  ctx.globalAlpha=1;
  // bullets
  ctx.fillStyle="#eafcff";for(var b=0;b<bullets.length;b++){var bu=bullets[b];ctx.beginPath();ctx.arc(bu.x,bu.y,bu.r,0,TAU);ctx.fill();}
  // enemies
  for(var e=0;e<enemies.length;e++){var en=enemies[e];
    ctx.fillStyle=en.hitT>0?"#ffffff":en.col;ctx.beginPath();ctx.arc(en.x,en.y,en.r,0,TAU);ctx.fill();
    if(en.boss){ctx.globalCompositeOperation="source-over";ctx.strokeStyle="#ff4fd8";ctx.lineWidth=3;ctx.beginPath();ctx.arc(en.x,en.y,en.r+5,0,TAU);ctx.stroke();
      ctx.fillStyle="#12162a";ctx.fillRect(en.x-en.r,en.y-en.r-10,en.r*2,4);ctx.fillStyle="#ff4fd8";ctx.fillRect(en.x-en.r,en.y-en.r-10,en.r*2*(en.hp/en.maxhp),4);ctx.globalCompositeOperation="lighter";}
  }
  // player
  if(state!=="start"){
    ctx.globalCompositeOperation="source-over";
    ctx.save();ctx.translate(player.x,player.y);
    ctx.fillStyle="#35e6f2";ctx.shadowColor="#35e6f2";ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,0,player.r,0,TAU);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle="#05060b";ctx.beginPath();ctx.arc(0,0,player.r*0.45,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation="source-over";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

showStart();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
